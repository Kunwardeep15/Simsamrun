<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky Runner</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background: #111;
        font-family: Arial, sans-serif;
        overflow: hidden;
        user-select: none;
    }

    #game {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #87CEEB;
    }

    #ui {
        position: fixed;
        top: 20px;
        left: 20px;
        color: white;
        font-size: 22px;
        font-weight: bold;
        text-shadow: 2px 2px 4px #000;
        z-index: 5;
    }

    #startScreen,
    #gameOver {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: rgba(0, 0, 0, 0.65);
        color: white;
        z-index: 10;
        text-align: center;
    }

    #gameOver {
        display: none;
    }

    h1 {
        font-size: 55px;
        margin-bottom: 10px;
    }

    p {
        font-size: 20px;
        margin: 8px;
    }

    button {
        margin-top: 20px;
        padding: 15px 35px;
        border: none;
        border-radius: 10px;
        background: #ff9800;
        color: white;
        font-size: 22px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #ffb52e;
    }
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">
    Score: <span id="score">0</span>
    &nbsp;&nbsp;
    Coins: <span id="coins">0</span>
</div>

<div id="startScreen">
    <h1>🏃 Sky Runner</h1>
    <p>Jump over obstacles and collect coins!</p>
    <p>Press SPACE or tap the screen to jump.</p>
    <button onclick="startGame()">START GAME</button>
</div>

<div id="gameOver">
    <h1>💥 Game Over</h1>
    <p>Your Score: <span id="finalScore">0</span></p>
    <p>Your Coins: <span id="finalCoins">0</span></p>
    <button onclick="startGame()">PLAY AGAIN</button>
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W, H;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);


/* =========================
   GAME VARIABLES
========================= */

let playing = false;
let score = 0;
let coinsCollected = 0;
let speed = 7;
let frame = 0;

const gravity = 0.7;
const groundHeight = 100;


/* =========================
   PLAYER
========================= */

const player = {
    x: 100,
    y: 0,
    width: 45,
    height: 60,
    velocityY: 0,
    jumping: false,

    reset() {
        this.x = 100;
        this.y = H - groundHeight - this.height;
        this.velocityY = 0;
        this.jumping = false;
    },

    jump() {
        if (!this.jumping) {
            this.velocityY = -15;
            this.jumping = true;
        }
    },

    update() {
        this.velocityY += gravity;
        this.y += this.velocityY;

        const ground = H - groundHeight - this.height;

        if (this.y >= ground) {
            this.y = ground;
            this.velocityY = 0;
            this.jumping = false;
        }
    },

    draw() {
        // Body
        ctx.fillStyle = "#3498db";
        ctx.fillRect(
            this.x,
            this.y + 20,
            this.width,
            this.height - 20
        );

        // Head
        ctx.fillStyle = "#ffd1a9";
        ctx.beginPath();
        ctx.arc(
            this.x + 23,
            this.y + 15,
            16,
            0,
            Math.PI * 2
        );
        ctx.fill();

        // Hair
        ctx.fillStyle = "#222";
        ctx.beginPath();
        ctx.arc(
            this.x + 23,
            this.y + 8,
            15,
            Math.PI,
            Math.PI * 2
        );
        ctx.fill();

        // Eye
        ctx.fillStyle = "#000";
        ctx.beginPath();
        ctx.arc(
            this.x + 29,
            this.y + 13,
            2,
            0,
            Math.PI * 2
        );
        ctx.fill();

        // Legs
        ctx.strokeStyle = "#222";
        ctx.lineWidth = 6;

        ctx.beginPath();
        ctx.moveTo(this.x + 12, this.y + 55);
        ctx.lineTo(this.x + 5, this.y + 68);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(this.x + 32, this.y + 55);
        ctx.lineTo(this.x + 40, this.y + 68);
        ctx.stroke();
    }
};


/* =========================
   OBSTACLES
========================= */

let obstacles = [];

function createObstacle() {

    const height = 40 + Math.random() * 50;

    obstacles.push({
        x: W + 50,
        y: H - groundHeight - height,
        width: 35,
        height: height
    });
}

function updateObstacles() {

    for (let i = obstacles.length - 1; i >= 0; i--) {

        obstacles[i].x -= speed;

        if (obstacles[i].x + obstacles[i].width < 0) {
            obstacles.splice(i, 1);
        }
    }
}

function drawObstacles() {

    obstacles.forEach(o => {

        ctx.fillStyle = "#e74c3c";

        ctx.fillRect(
            o.x,
            o.y,
            o.width,
            o.height
        );

        // warning stripes
        ctx.fillStyle = "#f1c40f";

        for (let y = o.y + 5; y < o.y + o.height; y += 15) {
            ctx.fillRect(
                o.x,
                y,
                o.width,
                5
            );
        }
    });
}


/* =========================
   COINS
========================= */

let coins = [];

function createCoin() {

    coins.push({
        x: W + 50,
        y: H - groundHeight - 100 - Math.random() * 100,
        radius: 12,
        collected: false
    });
}

function updateCoins() {

    for (let i = coins.length - 1; i >= 0; i--) {

        const c = coins[i];

        c.x -= speed;

        if (c.x + c.radius < 0) {
            coins.splice(i, 1);
        }
    }
}

function drawCoins() {

    coins.forEach(c => {

        ctx.fillStyle = "#ffd700";

        ctx.beginPath();

        ctx.arc(
            c.x,
            c.y,
            c.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.strokeStyle = "#f39c12";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = "#fff3a3";
        ctx.font = "bold 14px Arial";
        ctx.fillText("$", c.x - 5, c.y + 5);
    });
}


/* =========================
   COLLISION
========================= */

function collision(a, b) {

    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}

function coinCollision(player, coin) {

    return (
        player.x < coin.x + coin.radius &&
        player.x + player.width > coin.x - coin.radius &&
        player.y < coin.y + coin.radius &&
        player.y + player.height > coin.y - coin.radius
    );
}


/* =========================
   BACKGROUND
========================= */

let clouds = [
    {x: 200, y: 100, size: 1},
    {x: 600, y: 150, size: 0.8},
    {x: 1000, y: 80, size: 1.2}
];

function drawBackground() {

    // Sky
    ctx.fillStyle = "#87CEEB";
    ctx.fillRect(0, 0, W, H);

    // Sun
    ctx.fillStyle = "#FFD700";

    ctx.beginPath();

    ctx.arc(
        W - 100,
        100,
        45,
        0,
        Math.PI * 2
    );

    ctx.fill();

    // Clouds
    clouds.forEach(cloud => {

        ctx.fillStyle = "white";

        ctx.beginPath();

        ctx.arc(
            cloud.x,
            cloud.y,
            25 * cloud.size,
            0,
            Math.PI * 2
        );

        ctx.arc(
            cloud.x + 30 * cloud.size,
            cloud.y - 10 * cloud.size,
            30 * cloud.size,
            0,
            Math.PI * 2
        );

        ctx.arc(
            cloud.x + 65 * cloud.size,
            cloud.y,
            25 * cloud.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

        cloud.x -= speed * 0.15;

        if (cloud.x < -100) {
            cloud.x = W + 100;
        }
    });

    // Ground
    ctx.fillStyle = "#2ecc71";

    ctx.fillRect(
        0,
        H - groundHeight,
        W,
        groundHeight
    );

    // Ground line
    ctx.fillStyle = "#27ae60";

    ctx.fillRect(
        0,
        H - groundHeight,
        W,
        12
    );
}


/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    if (!playing) return;

    frame++;

    drawBackground();

    player.update();

    // Spawn obstacles
    if (frame % 100 === 0) {
        createObstacle();
    }

    // Spawn coins
    if (frame % 70 === 0) {
        createCoin();
    }

    updateObstacles();
    updateCoins();

    drawObstacles();
    drawCoins();
    player.draw();

    // Collision with obstacles
    for (const obstacle of obstacles) {

        if (collision(player, obstacle)) {
            endGame();
            return;
        }
    }

    // Collect coins
    for (let i = coins.length - 1; i >= 0; i--) {

        if (coinCollision(player, coins[i])) {

            coinsCollected++;

            coins.splice(i, 1);

            document.getElementById("coins").textContent =
                coinsCollected;
        }
    }

    // Score
    score++;

    document.getElementById("score").textContent =
        Math.floor(score / 10);

    // Increase difficulty
    if (frame % 600 === 0) {
        speed += 0.5;
    }

    requestAnimationFrame(gameLoop);
}


/* =========================
   START GAME
========================= */

function startGame() {

    playing = true;

    score = 0;
    coinsCollected = 0;
    speed = 7;
    frame = 0;

    obstacles = [];
    coins = [];

    document.getElementById("score").textContent = "0";
    document.getElementById("coins").textContent = "0";

    document.getElementById("startScreen").style.display = "none";
    document.getElementById("gameOver").style.display = "none";

    player.reset();

    gameLoop();
}


/* =========================
   GAME OVER
========================= */

function endGame() {

    playing = false;

    document.getElementById("finalScore").textContent =
        Math.floor(score / 10);

    document.getElementById("finalCoins").textContent =
        coinsCollected;

    document.getElementById("gameOver").style.display = "flex";
}


/* =========================
   CONTROLS
========================= */

document.addEventListener("keydown", function(event) {

    if (
        event.code === "Space" ||
        event.code === "ArrowUp"
    ) {
        event.preventDefault();

        if (playing) {
            player.jump();
        }
    }
});


canvas.addEventListener("touchstart", function(event) {

    event.preventDefault();

    if (playing) {
        player.jump();
    }
});


canvas.addEventListener("mousedown", function() {

    if (playing) {
        player.jump();
    }
});

</script>

</body>
</html>
